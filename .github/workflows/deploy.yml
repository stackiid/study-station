name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows manually triggering a deploy from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # GitHub Pages project sites are served from /<repo-name>/, so the
        # base path is set from the repository name at build time. React
        # Router picks this up at runtime via import.meta.env.BASE_URL.
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Add SPA fallback for GitHub Pages
        # GitHub Pages has no server-side rewrite rules, so a direct visit
        # to e.g. /courses would 404. Copying index.html to 404.html lets
        # GitHub Pages serve the app shell for any unmatched path, and
        # React Router takes over from there.
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
